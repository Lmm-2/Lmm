<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Files</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#f8f6f1;
  --paper:#fffdf9;
  --text:#27302c;
  --muted:#7b7d77;
  --line:#dedbd3;

  --study:#e5edf2;
  --study-accent:#607786;

  --self:#e6eee5;
  --self-accent:#667c68;

  --life:#ebe5ed;
  --life-accent:#776b7c;

  --shadow:0 18px 50px rgba(38,43,40,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans","Noto Sans Arabic",sans-serif;
}

body[dir="rtl"]{
  font-family:"Noto Sans Arabic","DM Sans",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#languageScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 15%,#e8eef2 0,transparent 30%),
    radial-gradient(circle at 85% 85%,#ebe5ed 0,transparent 30%),
    var(--bg);
}

.language-box{
  width:min(500px,100%);
  background:rgba(255,253,249,.94);
  border:1px solid var(--line);
  padding:50px 40px;
  text-align:center;
  box-shadow:var(--shadow);
}

.language-box .tiny{
  font-family:"Cormorant Garamond",serif;
  font-size:23px;
  color:var(--muted);
  margin-bottom:8px;
}

.language-box h1{
  font-family:"Playfair Display",serif;
  font-size:44px;
  font-weight:600;
}

.language-box p{
  color:var(--muted);
  line-height:1.7;
  margin:12px 0 30px;
}

.language-buttons{
  display:grid;
  gap:10px;
}

.language-buttons button{
  background:white;
  border:1px solid var(--line);
  padding:15px;
  transition:.2s;
}

.language-buttons button:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}


/* HEADER */

#site{
  display:none;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(248,246,241,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(222,219,211,.7);
}

.nav{
  height:76px;
  max-width:1180px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-family:"Playfair Display",serif;
  font-size:24px;
}

.nav-right{
  display:flex;
  gap:9px;
  align-items:center;
}

.lang-btn,
.menu-btn{
  border:1px solid var(--line);
  background:var(--paper);
  height:42px;
}

.lang-btn{
  border-radius:30px;
  padding:0 14px;
}

.menu-btn{
  width:42px;
  border-radius:12px;
  font-size:19px;
}

.menu{
  display:none;
  position:absolute;
  top:68px;
  right:24px;
  width:205px;
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:8px;
}

body[dir="rtl"] .menu{
  right:auto;
  left:24px;
}

.menu.open{
  display:block;
}

.menu button{
  width:100%;
  border:0;
  background:transparent;
  padding:12px 14px;
  text-align:left;
  color:var(--text);
}

body[dir="rtl"] .menu button{
  text-align:right;
}

.menu button:hover{
  background:var(--bg);
}


/* GENERAL */

.page{
  display:none;
  max-width:1180px;
  margin:auto;
  padding:80px 24px;
}

.page.active{
  display:block;
}

.eyebrow{
  color:var(--muted);
  font-size:11px;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin-bottom:15px;
}

body[dir="rtl"] .eyebrow{
  letter-spacing:0;
}

h1,h2,h3{
  font-family:"Playfair Display",serif;
  font-weight:600;
}

.muted{
  color:var(--muted);
}


/* HOME */

.hero{
  min-height:610px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:70px;
}

.hero h1{
  font-size:clamp(60px,8vw,96px);
  line-height:.93;
  letter-spacing:-3px;
}

.hero h1 .script{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-weight:600;
  letter-spacing:-1px;
}

.hero-description{
  max-width:500px;
  margin-top:27px;
  color:var(--muted);
  line-height:1.8;
  font-size:16px;
}

.primary{
  display:inline-flex;
  margin-top:28px;
  padding:14px 23px;
  border:0;
  background:var(--text);
  color:white;
  border-radius:30px;
  font-weight:600;
}

.hero-visual{
  height:430px;
  position:relative;
}

.sheet{
  position:absolute;
  width:275px;
  height:350px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.sheet.back{
  background:var(--study);
  left:13%;
  top:15%;
  transform:rotate(-8deg);
}

.sheet.middle{
  background:var(--life);
  left:28%;
  top:8%;
  transform:rotate(5deg);
}

.sheet.front{
  background:var(--paper);
  left:21%;
  top:18%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.sheet.front .mini{
  font-family:"Cormorant Garamond",serif;
  color:var(--muted);
  font-size:22px;
}

.sheet.front strong{
  font-family:"Playfair Display",serif;
  font-size:35px;
  margin:8px 0;
}

.home-collections{
  margin-top:30px;
}

.home-title{
  margin-bottom:25px;
}

.home-title h2{
  font-size:42px;
}

.collection-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.collection{
  padding:28px;
  min-height:205px;
  border:1px solid var(--line);
  position:relative;
  cursor:pointer;
  transition:.2s;
}

.collection:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}

.collection h3{
  font-size:29px;
  margin-bottom:12px;
}

.collection p{
  max-width:260px;
  color:var(--muted);
  line-height:1.65;
}

.collection .arrow{
  position:absolute;
  right:25px;
  bottom:22px;
  font-size:20px;
}

body[dir="rtl"] .collection .arrow{
  right:auto;
  left:25px;
}

.collection.study{
  background:var(--study);
}

.collection.self{
  background:var(--self);
}

.collection.life{
  background:var(--life);
}


/* FILES */

.files-top{
  text-align:center;
  max-width:700px;
  margin:0 auto 65px;
}

.files-top h1{
  font-size:64px;
  line-height:1;
}

.files-top p{
  color:var(--muted);
  line-height:1.8;
  margin-top:17px;
}

.file-section{
  margin-bottom:60px;
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
  margin-bottom:22px;
}

.section-name{
  display:flex;
  align-items:center;
  gap:14px;
}

.section-number{
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  color:var(--muted);
}

.section-name h2{
  font-size:39px;
}

.section-description{
  max-width:390px;
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}


/* SAME GRID, DIFFERENT SECTION PERSONALITY */

.study-section .section-head{
  border-bottom-color:#cdd9df;
}

.self-section .section-head{
  border-bottom-color:#cedbcf;
}

.life-section .section-head{
  border-bottom-color:#d7cdd9;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}


/* EACH FILE HAS ITS OWN MODEL */

.product{
  min-height:270px;
  border:1px solid var(--line);
  background:var(--paper);
  padding:25px;
  position:relative;
  cursor:pointer;
  transition:.22s;
  display:flex;
  flex-direction:column;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}

.product-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.product-icon{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  color:var(--muted);
}

.product-number{
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--muted);
}

.product h3{
  font-size:27px;
  line-height:1.1;
  margin-top:45px;
  margin-bottom:10px;
}

.product p{
  color:var(--muted);
  line-height:1.65;
  font-size:14px;
}

.product-link{
  margin-top:auto;
  padding-top:22px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
}


/* individual subtle models */

.study-planner{
  border-top:5px solid var(--study-accent);
}

.exam-planner{
  background:
    linear-gradient(to bottom,transparent 0,transparent 94%,#d9e4ea 94%);
}

.exam-planner .product-icon{
  border:1px solid var(--study-accent);
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
}

.homework-tracker{
  border-left:5px solid #91a4b0;
}

body[dir="rtl"] .homework-tracker{
  border-left:1px solid var(--line);
  border-right:5px solid #91a4b0;
}

.selfcare-planner{
  background:#fbfdf9;
}

.selfcare-planner .product-icon{
  color:var(--self-accent);
}

.habit-tracker{
  background:
    repeating-linear-gradient(
      to bottom,
      #fbfdf9 0,
      #fbfdf9 34px,
      #e1e9df 35px
    );
}

.habit-tracker .product-icon{
  font-size:19px;
}

.hair-guide{
  background:#fcf9f6;
}

.hair-guide .product-icon{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-size:31px;
}

.wishlist{
  background:#fcfafc;
}

.wishlist .product-icon{
  font-size:22px;
}

.birthday{
  background:#fffaf7;
  text-align:left;
}

body[dir="rtl"] .birthday{
  text-align:right;
}

.birthday .product-icon{
  font-size:21px;
}


/* ABOUT */

.about-intro{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:80px;
  align-items:end;
  padding-bottom:65px;
  border-bottom:1px solid var(--line);
}

.about-intro h1{
  font-size:clamp(60px,8vw,90px);
  line-height:.94;
}

.about-intro h1 em{
  font-family:"Cormorant Garamond",serif;
  font-weight:500;
}

.about-copy{
  color:var(--muted);
  line-height:1.9;
  max-width:440px;
}

.about-statement{
  padding:70px 0;
  text-align:center;
}

.about-statement p{
  max-width:750px;
  margin:auto;
  font-family:"Cormorant Garamond",serif;
  font-size:43px;
  line-height:1.2;
}

.about-details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.about-detail{
  padding:35px 25px;
  min-height:190px;
}

.about-detail + .about-detail{
  border-left:1px solid var(--line);
}

body[dir="rtl"] .about-detail + .about-detail{
  border-left:0;
  border-right:1px solid var(--line);
}

.about-detail h3{
  font-size:26px;
  margin-bottom:12px;
}

.about-detail p{
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}


/* GUIDE */

.guide-top{
  max-width:700px;
  margin:0 auto 60px;
  text-align:center;
}

.guide-top h1{
  font-size:60px;
}

.guide-top p{
  color:var(--muted);
  line-height:1.8;
  margin-top:15px;
}

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:70px;
}

.step{
  padding:30px 22px;
  min-height:205px;
}

.step + .step{
  border-left:1px solid var(--line);
}

body[dir="rtl"] .step + .step{
  border-left:0;
  border-right:1px solid var(--line);
}

.step-number{
  font-family:"Cormorant Garamond",serif;
  font-size:25px;
  color:var(--muted);
}

.step h3{
  margin:22px 0 10px;
  font-size:24px;
}

.step p{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.faq{
  max-width:850px;
  margin:auto;
}

.faq h2{
  text-align:center;
  font-size:43px;
  margin-bottom:25px;
}

.faq-item{
  border-top:1px solid var(--line);
  padding:19px 5px;
}

.faq-item:last-child{
  border-bottom:1px solid var(--line);
}

.faq-item summary{
  cursor:pointer;
  font-weight:600;
}

.faq-item p{
  color:var(--muted);
  line-height:1.7;
  margin-top:12px;
  font-size:14px;
}


/* CONTACT */

.contact{
  max-width:700px;
  margin:auto;
}

.contact h1{
  font-size:60px;
}

.contact-intro{
  color:var(--muted);
  margin:14px 0 35px;
}

.contact-form{
  border-top:1px solid var(--line);
}

.contact-row{
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.contact-row label{
  display:block;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}

body[dir="rtl"] .contact-row label{
  letter-spacing:0;
}

.contact-row input,
.contact-row textarea{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  resize:vertical;
}

.contact-row textarea{
  min-height:100px;
}


/* POPUP */

.popup{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(35,39,36,.4);
  backdrop-filter:blur(8px);
}

.popup.show{
  display:flex;
}

.popup-box{
  width:min(500px,100%);
  background:var(--paper);
  padding:38px;
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.16);
}

.close{
  position:absolute;
  right:18px;
  top:18px;
  width:35px;
  height:35px;
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:50%;
}

body[dir="rtl"] .close{
  right:auto;
  left:18px;
}

.popup h2{
  font-size:35px;
  padding-right:35px;
}

body[dir="rtl"] .popup h2{
  padding-right:0;
  padding-left:35px;
}

.popup-description{
  color:var(--muted);
  line-height:1.7;
  margin:12px 0 20px;
}

.download-note{
  background:var(--bg);
  border:1px solid var(--line);
  padding:14px;
  font-size:13px;
  line-height:1.6;
  margin-bottom:14px;
}

.download-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.download-buttons button{
  border:0;
  background:var(--text);
  color:white;
  padding:13px;
}


/* FOOTER */

footer{
  border-top:1px solid var(--line);
  max-width:1180px;
  margin:auto;
  padding:28px 24px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}


/* MOBILE */

@media(max-width:850px){

  .hero,
  .about-intro{
    grid-template-columns:1fr;
    gap:45px;
  }

  .hero{
    padding-top:25px;
  }

  .hero-visual{
    height:380px;
  }

  .collection-grid,
  .product-grid{
    grid-template-columns:1fr;
  }

  .steps{
    grid-template-columns:1fr 1fr;
  }

  .about-details{
    grid-template-columns:1fr;
  }

  .about-detail + .about-detail{
    border-left:0;
    border-right:0;
    border-top:1px solid var(--line);
  }

  body[dir="rtl"] .about-detail + .about-detail{
    border-right:0;
  }

  .section-head{
    display:block;
  }

  .section-description{
    margin-top:10px;
  }
}

@media(max-width:550px){

  .page{
    padding:58px 18px;
  }

  .nav{
    padding:0 18px;
  }

  .hero h1{
    font-size:60px;
  }

  .hero-visual{
    transform:scale(.82);
    transform-origin:center;
    margin:-30px 0;
  }

  .files-top h1,
  .guide-top h1,
  .contact h1{
    font-size:50px;
  }

  .steps{
    grid-template-columns:1fr;
  }

  .step + .step{
    border-left:0;
    border-right:0;
    border-top:1px solid var(--line);
  }

  body[dir="rtl"] .step + .step{
    border-right:0;
    border-top:1px solid var(--line);
  }

  .download-buttons{
    grid-template-columns:1fr;
  }

  .popup-box{
    padding:30px 23px;
  }
}
</style>
</head>

<body>

<!-- LANGUAGE -->

<section id="languageScreen">

  <div class="language-box">

    <div class="tiny">welcome ♡</div>

    <h1>Digital Files</h1>

    <p>
      Choose your language to continue.
      <br>
      اختاري اللغة للمتابعة.
    </p>

    <div class="language-buttons">
      <button onclick="startSite('en')">🇬🇧 English</button>
      <button onclick="startSite('ar')">🇦🇪 العربية</button>
    </div>

  </div>

</section>


<div id="site">

<header>

  <div class="nav">

    <div class="brand">Digital Files</div>

    <div class="nav-right">

      <button class="lang-btn" onclick="changeLanguage()">
        🌐 <span id="langLabel">AR</span>
      </button>

      <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </div>

    <div class="menu" id="menu">

      <button onclick="showPage('home')">
        <span data-en="Home" data-ar="الرئيسية"></span>
      </button>

      <button onclick="showPage('files')">
        <span data-en="Files" data-ar="الملفات"></span>
      </button>

      <button onclick="showPage('about')">
        <span data-en="About" data-ar="نبذة"></span>
      </button>

      <button onclick="showPage('guide')">
        <span data-en="Guide" data-ar="دليل الإرشاد"></span>
      </button>

      <button onclick="showPage('contact')">
        <span data-en="Contact" data-ar="التواصل"></span>
      </button>

    </div>

  </div>

</header>


<!-- HOME -->

<main id="home" class="page active">

  <section class="hero">

    <div>

      <div class="eyebrow"
           data-en="A little digital corner ♡"
           data-ar="مساحتك الرقمية الصغيرة ♡">
      </div>

      <h1>
        <span data-en="Digital" data-ar="ملفات"></span>
        <br>
        <span class="script"
              data-en="Files"
              data-ar="رقمية">
        </span>
      </h1>

      <p class="hero-description"
         data-en="Simple digital things made to make your day easier, prettier and a little more organised."
         data-ar="ملفات رقمية بسيطة صُممت لتجعل يومك أسهل، أجمل وأكثر ترتيبًا.">
      </p>

      <button class="primary" onclick="showPage('files')">
        <span data-en="Explore Files →"
              data-ar="استكشفي الملفات ←">
        </span>
      </button>

    </div>


    <div class="hero-visual">

      <div class="sheet back"></div>

      <div class="sheet middle"></div>

      <div class="sheet front">

        <span class="mini">little</span>

        <strong>things</strong>

        <span class="mini">made with care ♡</span>

      </div>

    </div>

  </section>


  <section class="home-collections">

    <div class="home-title">

      <div class="eyebrow"
           data-en="Collections"
           data-ar="الأقسام">
      </div>

function startSite(lang){

  currentLang=lang;

  document.getElementById("languageScreen").style.display="none";
  document.getElementById("site").style.display="block";

  updateLanguage();

}


function changeLanguage(){

  currentLang=currentLang==="en"?"ar":"en";

  updateLanguage();

}


function updateLanguage(){

  document.documentElement.lang=currentLang;

  document.body.dir=currentLang==="ar"?"rtl":"ltr";

  document.getElementById("langLabel").textContent=
    currentLang==="en"?"AR":"EN";


  document.querySelectorAll("[data-en]").forEach(el=>{

    el.textContent=
      currentLang==="en"
      ?el.dataset.en
      :el.dataset.ar;

  });


  document.getElementById("footerText").textContent=
    translations[currentLang].footer;


  if(currentProduct){

    const p=products[currentProduct][currentLang];

    document.getElementById("popupTitle").textContent=p.title;

    document.getElementById("popupDescription").textContent=p.description;

    document.getElementById("downloadNote").textContent=
      translations[currentLang].note;

  }

}


function toggleMenu(){

  document.getElementById("menu").classList.toggle("open");

}

function createPDF(){

  const {jsPDF}=window.jspdf;

  return new jsPDF({
    orientation:"portrait",
    unit:"mm",
    format:"a4"
  });

}


function basePDF(doc,title,subtitle){

  doc.setFillColor(248,246,241);
  doc.rect(0,0,210,297,"F");

  doc.setFillColor(255,253,249);
  doc.roundedRect(15,15,180,267,5,5,"F");

  doc.setDrawColor(222,219,211);
  doc.roundedRect(15,15,180,267,5,5);

  doc.setTextColor(39,48,44);
  doc.setFont("helvetica","bold");
  doc.setFontSize(23);
  doc.text(title,25,36);

  doc.setTextColor(123,125,119);
  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  doc.text(subtitle,25,45);

}


function pdfBox(doc,x,y,w,h,title){

  doc.setFillColor(250,249,246);
  doc.setDrawColor(225,222,214);

  doc.roundedRect(x,y,w,h,4,4,"FD");

  doc.setTextColor(39,48,44);
  doc.setFont("helvetica","bold");
  doc.setFontSize(10);

  if(title){
    doc.text(title,x+6,y+10);
  }

}


function pdfLine(doc,x,y,w){

  doc.setDrawColor(220,217,210);
  doc.line(x,y,x+w,y);

}


async function loadArabicFont(doc){

  try{

    const response=await fetch(
      "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/amiri/Amiri-Regular.ttf"
    );

    if(!response.ok) throw new Error();

    const buffer=await response.arrayBuffer();

    let binary="";

    const bytes=new Uint8Array(buffer);

    for(let i=0;i<bytes.length;i++){
      binary+=String.fromCharCode(bytes[i]);
    }

    doc.addFileToVFS(
      "Amiri-Regular.ttf",
      btoa(binary)
    );

    doc.addFont(
      "Amiri-Regular.ttf",
      "Amiri",
      "normal"
    );

    return true;

  }catch(error){

    return false;

  }

}


function arText(doc,text,x,y,size=11){

  doc.setFont("Amiri");
  doc.setFontSize(size);
  doc.setTextColor(39,48,44);

  const fixed=
    typeof doc.processArabic==="function"
    ?doc.processArabic(text)
    :text;

  doc.text(fixed,x,y,{align:"right"});

}
